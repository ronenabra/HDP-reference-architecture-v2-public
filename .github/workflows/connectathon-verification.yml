# Manual only during publication preparation. Prepare external contract inputs
# and integrate regression ownership before enabling automatic runs.
name: Connectathon verification

on:
  workflow_dispatch:
    inputs:
      full:
        description: Run the disposable runtime and browser release gate
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  fast:
    name: Fast component and contract gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci
      - name: Cache hash-pinned public contract bytes
        uses: actions/cache@v4
        with:
          path: .contract-inputs/cache
          key: public-contracts-${{ hashFiles('docs/external-contract-inputs.json') }}
      - run: npm run prepare:contracts
      - run: npm run verify:fast

  full:
    name: Disposable runtime and browser gate
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full)
    runs-on: ubuntu-24.04
    # Four presets include sequential private HAPI imports and populated browser journeys.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci
      - name: Cache hash-pinned public contract bytes
        uses: actions/cache@v4
        with:
          path: .contract-inputs/cache
          key: public-contracts-${{ hashFiles('docs/external-contract-inputs.json') }}
      - run: npm run prepare:contracts
      - run: npm run verify:full -- --wait-timeout 600
      - name: Retain connectathon evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connectathon-release-evidence-${{ github.run_id }}
          path: tmp/release-evidence/
          if-no-files-found: error
          retention-days: 14
