"Foreign origin or invalid CSRF"}}}},"/admin/services/catalog":{"post":{"tags":["Services"],"operationId":"createAdminServiceCatalog","summary":"Create a pending catalog definition with zero provider registrations","description":"Closed bounded JSON over the existing service-definition form. Requires configured Admin login, same-origin CSRF bound to catalog-create and the expected private revision. Strict refuses private writes. PCM owns identity, providedBy is forbidden, duplicate names fail atomically. Public resource, immutable private definition, generation and authoritative audit commit in one existing-store/checkpoint transaction. Later provider connection and activation are explicit separate commands. Manual scope text is retained exactly with advisory syntax only and needs no compiler proof. An optional generated previewProof retains the reviewed fixed anchor; stale/changed proofs refuse. No token or clinical access results.","requestBody":{"required":true,"content":{"application/json":{"schema":{"type":"object","additionalProperties":false,"required":["csrf","expectedRevision","definition"],"properties":{"csrf":{"type":"string"},"expectedRevision":{"type":"integer","minimum":0},"definition":{"$ref":"#/components/schemas/AdminServiceDefinitionInput"},"previewProof":{"$ref":"#/components/schemas/AdminServicePreviewProof"}}}}}},"responses":{"200":{"description":"Pending canonical identity/version and registrationCount zero"},"400":{"description":"Invalid, incomplete, unbounded or extra form fields"},"401":{"description":"Admin login required"},"403":{"description":"Strict private-write restriction, foreign origin or invalid CSRF"},"409":{"description":"Duplicate name, stale revision or conflicting authority"},"503":{"description":"Configured login, persistence or authoritative audit unavailable; no partial commit"}}}},"/admin/services/{id}/sandbox":{"post":{"tags":["Services"],"operationId":"applyAdminServiceLifecycle","summary":"Approve, enable, disable or delete one exact service record","description":"Existing single-target private command. Configured Admin login, same-origin target/version CSRF and current expectedVersion are mandatory. Strict excludes all actions. Catalog approval/enable does not require a provider; registration activation requires a usable catalog and operational provider. Global freeze preserves individual states. Terminal decisions remain terminal. Deletion is inactive, non-cascading and dependency/seed/fixed-builtin guarded, including frozen approval history. All authority/audit/checkpoint writes are atomic; external diagnostic delivery follows commit. Runtime deletion alone is not durable across seed/reset; use the existing complete private checkpoint. This does not expose public FHIR DELETE.","parameters":[{"$ref":"#/components/parameters/ServiceInventoryId"}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"type":"object","additionalProperties":false,"required":["csrf","expectedVersion","action"],"properties":{"csrf":{"type":"string"},"expectedVersion":{"type":"string","pattern":"^[1-9][0-9]*$"},"action":{"type":"string","enum":["activate","enable","disable","delete"]}}}}}},"responses":{"200":{"description":"Exact committed target/action/version with diagnostic audit identity"},"400":{"description":"Invalid or extra fields"},"401":{"description":"Admin login required"},"403":{"description":"Strict restriction, foreign origin or invalid CSRF"},"404":{"description":"Service not found"},"409":{"description":"Stale version, lifecycle prerequisite or deletion blocker"},"503":{"description":"Configured login, persistence or authoritative audit unavailable"}}}},"/admin/services/catalog/{id}/validate":{"post":{"tags":["Services"],"operationId":"validateAdminServiceCatalog","summary":"Validate an exact stored definition before any provider is connected","description":"Requires configured Admin login, same-origin CSRF bound to id/current version and exactly expectedVersion/csrf
