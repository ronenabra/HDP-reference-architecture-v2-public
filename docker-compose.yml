networks:
  pcm-net:
    driver: bridge

services:
  # 1. PCM Core (Identity & Consent Hub)
  pcm-core:
    profiles: [legacy-diagnostic]
    image: ghcr.io/ronenabra/hdp-reference-architecture-v2-public-pcm-core:${VERSION:-0.2.0}
    build: ./src/pcm-core
    ports:
      - "${PCM_UI_PORT:-4000}:3001" # UI (HTTP)
      - "${PCM_API_PORT:-4001}:3000" # API (HTTPS/mTLS)
      - "${PCM_METADATA_PORT:-4002}:3005" # Public OAuth2 metadata (strict mTLS; bounded TLS in connectathon mode)
    volumes:
      - ./src/pcm-core:/app
      - ./src/shared:/shared:ro
      - ./pcm-connectathon/team-config.schema.json:/workspace/pcm-connectathon/team-config.schema.json:ro
      - ./config:/workspace/config:ro
      - /app/node_modules
      - ${TEAM_RUNTIME_DIR:-.}/certs:/runtime/certs
      - ${TEAM_RUNTIME_DIR:-.}/logs/pcm-core:/runtime/logs/pcm-core
      - ${TEAM_RUNTIME_DIR:-.}/logs:/runtime/shared-logs
      - ${TEAM_RUNTIME_DIR:-.}/state:/runtime/state
      - ${TEAM_CONFIG_HOST_PATH:-./pcm-connectathon/example-team-config.json}:/runtime/team-config.json
      - ${TEAM_RUNTIME_DIR:-.}/catalog:/runtime/catalog:ro
      - ./docs:/workspace/docs:ro
      - ./pcm-connectathon:/workspace/pcm-connectathon:ro
      - ./clinical-data:/clinical-data:ro
      - ${TEAM_RUNTIME_DIR:-.}/bundles:/runtime/bundles:ro
    networks:
      - pcm-net
    environment:
      - TEAM_ID=${TEAM_ID:-local}
      - PCM_CONFORMANCE_MODE=${PCM_CONFORMANCE_MODE:-connectathon}
      - TEAM_ADMIN_PASSWORD=${TEAM_ADMIN_PASSWORD:-}
      - TEAM_CONFIG_PATH=${TEAM_CONFIG_PATH:-/runtime/team-config.json}
      - PCM_API_CLIENT_AUTH_MODE=${PCM_API_CLIENT_AUTH_MODE:-mtls}
      - PCM_ALLOW_ANY_TOKEN_RESOURCE=${PCM_ALLOW_ANY_TOKEN_RESOURCE:-false}
      - PCM_ACCESS_TOKEN_EXPIRES_IN_SECONDS=${PCM_ACCESS_TOKEN_EXPIRES_IN_SECONDS:-30}
      - CERTS_DIR=/runtime/certs
      - LOG_DIR=/runtime/logs/pcm-core
      - SHARED_LOGS_DIR=/runtime/shared-logs
      - STATE_DIR=/runtime/state
      - CLINICAL_DATA_CONNECT_UPLOAD_TIMEOUT_MS=${CLINICAL_DATA_CONNECT_UPLOAD_TIMEOUT_MS:-120000}
      - CLINICAL_DATA_TRANSACTION_WAIT_TIMEOUT_MS=${CLINICAL_DATA_TRANSACTION_WAIT_TIMEOUT_MS:-3600000}
      - CLINICAL_DATA_VERIFICATION_TIMEOUT_MS=${CLINICAL_DATA_VERIFICATION_TIMEOUT_MS:-300000}
      - PORT=3000
      - UI_PORT=3001
      - METADATA_PORT=3005
      - NODE_ENV=development

  # 2. Data Source Gateway (NGINX Entry Point)
  ds-gateway:
    image: ghcr.io/ronenabra/hdp-reference-architecture-v2-public-ds-gateway:${VERSION:-0.2.0}
    build: ./src/ds-gateway
    profiles:
      - legacy-node-rollback
    ports:
      - "${DS_GATEWAY_PORT:-8080}:8080"
      - "${DS_GATEWAY_HTTP_PORT:-8081}:8081"
    volumes:
      - ./pcm-connectathon/nginx/nginx.conf.template:/etc/nginx/templates/pcm-connectathon.conf.template:ro
      - ${TEAM_RUNTIME_DIR:-.}/certs:/runtime/certs
      - ${TEAM_RUNTIME_DIR:-.}/logs/ds-gateway:/runtime/logs/ds-gateway
      - ${TEAM_CONFIG_HOST_PATH:-./pcm-connectathon/example-team-config.json}:/runtime/team-config.json:ro
      - ${TEAM_RUNTIME_DIR:-.}/catalog:/runtime/catalog:ro
    networks:
      - pcm-net
    environment:
      - TEAM_ID=${TEAM_ID:-local}
      - PCM_CONFORMANCE_MODE=${PCM_CONFORMANCE_MODE:-connectathon}
      - TEAM_CONFIG_PATH=${TEAM_CONFIG_PATH:-/runtime/team-config.json}
      - DS_GATEWAY_CLIENT_AUTH_MODE=${DS_GATEWAY_CLIENT_AUTH_MODE:-mtls}
      - DS_FHIR_UPSTREAM_PROTOCOL=${DS_FHIR_UPSTREAM_PROTOCOL:-https}
      - DS_FHIR_UPSTREAM_VERIFY_SERVER_CERTIFICATE=${DS_FHIR_UPSTREAM_VERIFY_SERVER_CERTIFICATE:-false}
      - DS_FHIR_UPSTREAM_CUSTOM_URL=${DS_FHIR_UPSTREAM_CUSTOM_URL:-}
      - DS_GATEWAY_PORT=8080
      - DS_GATEWAY_HTTP_PORT=8081
      - HO_ID=${HO_ID:-legacy-ds}
      - DS_GATEWAY_CERT=/runtime/certs/ds-gateway.crt
      - DS_GATEWAY_KEY=/runtime/certs/ds-gateway.key
      - ROOT_CA_CERT=/runtime/certs/rootCA.crt
      - DS_AUTH_ADAPTER_HOST=ds-auth-adapter
      - DS_AUTH_ADAPTER_PORT=3000
      - DS_FHIR_SERVER_HOST=ds-fhir-server
      - DS_FHIR_SERVER_PORT=3000
    command:
      - /usr/local/bin/runtime-reload.sh
    depends_on:
      - ds-auth-adapter
      - ds-fhir-server

  # 3. Data Source Auth Adapter (PEP / Mapper)
  ds-auth-adapter:
    profiles: [legacy-diagnostic]
    image: ghcr.io/ronenabra/hdp-reference-architecture-v2-public-ds-auth-adapter:${VERSION:-0.2.0}
    build:
      context: src/ds-auth-adapter
    volumes:
      - ./src/ds-auth-adapter:/app
      - ./src/shared:/shared:ro
      - ./pcm-connectathon/team-config.schema.json:/workspace/pcm-connectathon/team-config.schema.json:ro
      - ./config/demo-services.schema.json:/workspace/config/demo-services.schema.json:ro
      - /app/node_modules
      - ${TEAM_RUNTIME_DIR:-.}/certs:/runtime/certs
      - ${TEAM_RUNTIME_DIR:-.}/logs/ds-auth-adapter:/runtime/logs/ds-auth-adapter
      - ${TEAM_RUNTIME_DIR:-.}/state:/runtime/state
      - ${TEAM_CONFIG_HOST_PATH:-./pcm-connectathon/example-team-config.json}:/runtime/team-config.json
      - ${TEAM_RUNTIME_DIR:-.}/catalog:/runtime/catalog:ro
    networks:
      - pcm-net
    environment:
      - TEAM_ID=${TEAM_ID:-local}
      - PCM_CONFORMANCE_MODE=${PCM_CONFORMANCE_MODE:-connectathon}
      - TEAM_CONFIG_PATH=${TEAM_CONFIG_PATH:-/runtime/team-config.json}
      - DS_GATEWAY_CLIENT_AUTH_MODE=${DS_GATEWAY_CLIENT_AUTH_MODE:-mtls}
      - CERTS_DIR=/runtime/certs
      - LOG_DIR=/runtime/logs/ds-auth-adapter
      - STATE_DIR=/runtime/state
      - PORT=3000
      - HO_ID=${HO_ID:-reference}
      - DS_EXPECTED_AUDIENCE=${DS_EXPECTED_AUDIENCE:-}
      - PCM_EXPECTED_ISSUER=${PCM_EXPECTED_ISSUER:-}
      - PCM_INTROSPECTION_AUTH_MODE=${PCM_INTROSPECTION_AUTH_MODE:-bearer}
      - DS_ASSERTION_KEY_PATH=${DS_ASSERTION_KEY_PATH:-/runtime/certs/ds-gateway-assertion.key}
      - DS_MTLS_CERT_PATH=${DS_MTLS_CERT_PATH:-/runtime/certs/ds-gateway.crt}
      - DS_MTLS_KEY_PATH=${DS_MTLS_KEY_PATH:-/runtime/certs/ds-gateway.key}
      - DS_ROOT_CA_PATH=${DS_ROOT_CA_PATH:-/runtime/certs/rootCA.crt}
      - LOCAL_JWT_ISSUER=${LOCAL_JWT_ISSUER:-https://ds-auth-adapter.internal/reference}
      - LOCAL_JWT_AUDIENCE=${LOCAL_JWT_AUDIENCE:-urn:pcm:ho:reference:fhir-server}
      - LOCAL_JWT_SIGNING_KEY_PATH=${LOCAL_JWT_SIGNING_KEY_PATH:-/runtime/certs/ds-gateway.key}
      - LOCAL_JWT_KEY_ID=${LOCAL_JWT_KEY_ID:-}
      - DS_ENFORCE_RESOURCE_CERT_CORRELATION=${DS_ENFORCE_RESOURCE_CERT_CORRELATION:-false}

  # 4. Data Source FHIR Server (Internal Resource Server)
  ds-fhir-server:
    image: ghcr.io/ronenabra/hdp-reference-architecture-v2-public-ds-fhir-server:${VERSION:-0.2.0}
    build: ./src/ds-fhir-server
    profiles:
      - legacy-node-rollback
    volumes:
      - ./src/ds-fhir-server:/app
      - ./src/shared:/shared:ro
      - ./pcm-connectathon/team-config.schema.json:/workspace/pcm-connectathon/team-config.schema.json:ro
      - ./config/demo-services.schema.json:/workspace/config/demo-services.schema.json:ro
      - /app/node_modules
      - ${TEAM_RUNTIME_DIR:-.}/certs:/runtime/certs
      - ${TEAM_RUNTIME_DIR:-.}/logs/ds-fhir-server:/runtime/logs/ds-fhir-server
      - ${TEAM_RUNTIME_DIR:-.}/state:/runtime/state
      - ${TEAM_CONFIG_HOST_PATH:-./pcm-connectathon/example-team-config.json}:/runtime/team-config.json:ro
      - ${TEAM_RUNTIME_DIR:-.}/catalog:/runtime/catalog:ro
    networks:
      - pcm-net
    environment:
      - TEAM_ID=${TEAM_ID:-local}
      - PCM_CONFORMANCE_MODE=${PCM_CONFORMANCE_MODE:-connectathon}
      - TEAM_CONFIG_PATH=${TEAM_CONFIG_PATH:-/runtime/team-config.json}
      - CERTS_DIR=/runtime/certs
      - LOG_DIR=/runtime/logs/ds-fhir-server
      - STATE_DIR=/runtime/state
      - PORT=3000
      - HO_ID=${HO_ID:-reference}
      - DS_AUTH_ADAPTER_URL=http://ds-auth-adapter:3000
      - LOCAL_JWT_AUTHORIZATION_SERVER_METADATA_URL=${LOCAL_JWT_AUTHORIZATION_SERVER_METADATA_URL:-http://ds-auth-adapter:3000/.well-known/oauth-authorization-server}
      - LOCAL_JWT_ISSUER=${LOCAL_JWT_ISSUER:-https://ds-auth-adapter.internal/reference}
      - LOCAL_JWT_AUDIENCE=${LOCAL_JWT_AUDIENCE:-urn:pcm:ho:reference:fhir-server}
      - FHIR_SERVER_TLS=${FHIR_SERVER_TLS:-true}
      - FHIR_SERVER_CERT=/runtime/certs/ds-fhir-server.crt
      - FHIR_SERVER_KEY=/runtime/certs/ds-fhir-server.key

  # Single-HO local HAPI diagnostics. The active three-HO topology is defined
  # in pcm-connectathon/compose.ho.yaml; this service publishes no port.
  ho-fhir-server:
    image: pcm-ho-fhir:${PCM_HAPI_VERSION:-0.2.0}
    build: ./src/ho-fhir-server
    profiles:
      - hapi
    volumes:
      - ${TEAM_RUNTIME_DIR:-.}/certs:/runtime/certs:ro
      - ${TEAM_CONFIG_HOST_PATH:-./pcm-connectathon/example-team-config.json}:/runtime/team-config.json:ro
      - ${TEAM_RUNTIME_DIR:-.}/catalog:/runtime/catalog:ro
    networks:
      - pcm-net
    environment:
      - HO_FHIR_DATABASE_URL=${HO_FHIR_DATABASE_URL:-jdbc:postgresql://ho-fhir-postgres:5432/hapi}
      - HO_FHIR_DATABASE_USER=${HO_FHIR_DATABASE_USER:-hapi}
      - HO_FHIR_DATABASE_PASSWORD=${HO_FHIR_DATABASE_PASSWORD:-local-hapi-only}
      - HO_FHIR_EXTERNAL_BASE=${HO_FHIR_EXTERNAL_BASE:-https://ds-gateway:8080/fhir}
      - HO_ID=${HO_ID:-reference}
      - PCM_LOCAL_JWT_ISSUER=${PCM_LOCAL_JWT_ISSUER:-https://ds-auth-adapter.internal/reference}
      - PCM_LOCAL_JWT_AUDIENCE=${PCM_LOCAL_JWT_AUDIENCE:-urn:pcm:ho:reference:fhir-server}
      - PCM_LOCAL_JWT_CERTIFICATE=${PCM_LOCAL_JWT_CERTIFICATE:-/runtime/certs/ds-gateway.crt}
      - TEAM_CONFIG_PATH=${TEAM_CONFIG_PATH:-/runtime/team-config.json}
    depends_on:
      ho-fhir-postgres:
        condition: service_healthy

  ho-fhir-postgres:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    profiles:
      - hapi
    networks:
      - pcm-net
    environment:
      - POSTGRES_DB=hapi
      - POSTGRES_USER=${HO_FHIR_DATABASE_USER:-hapi}
      - POSTGRES_PASSWORD=${HO_FHIR_DATABASE_PASSWORD:-local-hapi-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - ho-fhir-postgres-data:/var/lib/postgresql/data

  # 5. Service Provider Client (The Doctor's App)
  sp-client:
    profiles: [legacy-diagnostic]
    image: ghcr.io/ronenabra/hdp-reference-architecture-v2-public-sp-client:${VERSION:-0.2.0}
    build: ./src/sp-client
    ports:
      - "${SP_PORT:-3000}:3000"
    volumes:
      - ./src/sp-client:/app
      - ./src/shared:/shared:ro
      - ./pcm-connectathon/team-config.schema.json:/workspace/pcm-connectathon/team-config.schema.json:ro
      - ./config/demo-services.schema.json:/workspace/config/demo-services.schema.json:ro
      - /app/node_modules
      - ${TEAM_RUNTIME_DIR:-.}/certs:/runtime/certs
      - ${TEAM_RUNTIME_DIR:-.}/logs/sp-client:/runtime/logs/sp-client
      - ${TEAM_RUNTIME_DIR:-.}/state:/runtime/state
      - ${TEAM_CONFIG_HOST_PATH:-./pcm-connectathon/example-team-config.json}:/runtime/team-config.json
      - ${TEAM_RUNTIME_DIR:-.}/catalog:/runtime/catalog:ro
    networks:
      - pcm-net
    environment:
      - TEAM_ID=${TEAM_ID:-local}
      - PCM_CONFORMANCE_MODE=${PCM_CONFORMANCE_MODE:-connectathon}
      - TEAM_CONFIG_PATH=${TEAM_CONFIG_PATH:-/runtime/team-config.json}
      - SP_DS_VERIFY_SERVER_CERTIFICATE=${SP_DS_VERIFY_SERVER_CERTIFICATE:-false}
      - CERTS_DIR=/runtime/certs
      - LOG_DIR=/runtime/logs/sp-client
      - STATE_DIR=/runtime/state
      - PORT=3000
      - PCM_AUTH_URL=https://pcm-core:3000/api/fhir-service/r4
      - PCM_FHIR_URL=https://pcm-core:3000/api/fhir-service/r4
      - DS_GATEWAY_URL=https://ds-gateway:8080/fhir

volumes:
  ho-fhir-postgres-data:
